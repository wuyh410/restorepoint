name: Desktop builds
on:
  workflow_dispatch:
    inputs:
      ui_only:
        description: Run checks and render UI screenshots without rebuilding executables
        type: boolean
        default: false
  push:
    tags: ['v*']
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime and backup tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 rsync
      - run: python -m pip install -r requirements-build.txt
      - name: Provide fonts for Windows offscreen rendering
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fontDirectory = Join-Path $env:RUNNER_TEMP 'restorepoint-ui-fonts'
          New-Item -ItemType Directory -Force $fontDirectory | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' -OutFile (Join-Path $fontDirectory 'NotoSansCJKsc-Regular.otf')
          "QT_QPA_FONTDIR=$fontDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test desktop adapters and Qt widgets
        run: python -m unittest -v test_desktop.py test_deployment.py test_ui_updates.py
        env:
          QT_QPA_PLATFORM: offscreen
          RESTOREPOINT_UI_ARTIFACT_DIR: build/ui-checks
      - name: Test Linux backup engines
        if: runner.os == 'Linux'
        run: python -m unittest -v test_snapshot.py test_portable.py
      - run: python build_desktop.py --smoke-test
        if: ${{ !inputs.ui_only }}
      - name: Package Linux application
        if: ${{ runner.os == 'Linux' && !inputs.ui_only }}
        run: tar -C dist -czf dist/RestorePoint-Linux.tar.gz RestorePoint
      - name: Package Windows application
        if: ${{ runner.os == 'Windows' && !inputs.ui_only }}
        run: Compress-Archive -Path dist/RestorePoint -DestinationPath dist/RestorePoint-Windows.zip
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !inputs.ui_only }}
        with:
          name: RestorePoint-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: RestorePoint-UI-${{ runner.os }}
          path: build/ui-checks/*.png
          if-no-files-found: ignore
