name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Test desktop adapters and Qt widgets
        run: python -m unittest -v test_desktop.py test_deployment.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Test Linux backup engines
        if: runner.os == 'Linux'
        run: python -m unittest -v test_snapshot.py test_portable.py
      - run: python build_desktop.py --smoke-test
      - name: Package Linux application
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/RestorePoint-Linux.tar.gz RestorePoint
      - name: Package Windows application
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/RestorePoint -DestinationPath dist/RestorePoint-Windows.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: RestorePoint-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
